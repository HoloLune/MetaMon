<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="application-name" content="MetaMon">
  <meta name="description" content="Gioca ai tuoi giochi Game Boy Advance sugli occhiali Meta Ray-Ban Display. La ROM la carichi tu.">
  <title>MetaMon</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=19">
</head>
<body>
  <main id="loader" class="screen">
    <h1>MetaMon</h1>
    <p class="dim" id="ver">versione 19</p>
    <p id="status" class="dim">Avvio dell'emulatore…</p>

    <section id="library" hidden>
      <h2>I tuoi giochi</h2>
      <div id="romList" class="list"></div>
    </section>

    <section id="addRom" hidden>
      <h2>Aggiungi una ROM</h2>
      <div class="list">
        <button id="btnPhone" type="button">Invia dal telefono</button>
        <button id="btnFile" class="desktop-only" type="button">Scegli file</button>
        <input id="fileInput" type="file" accept=".gba,.gbc,.gb,.zip,.7z" tabindex="-1" aria-hidden="true">
        <button id="btnUrl" class="desktop-only" type="button">Scarica da URL</button>
      </div>
      <form id="urlForm" hidden>
        <input id="urlInput" type="url" placeholder="https://…/gioco.gba" aria-label="URL della ROM">
        <button type="submit">Scarica</button>
      </form>
    </section>

    <section id="tools" hidden>
      <div class="list"><button id="btnDiag" type="button">Prova comandi</button></div>
    </section>

    <section id="installPanel" hidden>
      <h2>Installa sugli occhiali</h2>
      <p class="dim">Inquadra con il telefono (Modalità sviluppatore attiva nell'app Meta AI).</p>
      <div id="qr"></div>
    </section>
  </main>

  <div id="pair" class="screen" hidden>
    <h2>Invia dal telefono</h2>
    <p>Sul telefono apri</p>
    <p><strong id="sendUrl"></strong></p>
    <p>e scrivi questo codice:</p>
    <p id="pairCode" class="code">····</p>
    <p id="pairStatus" class="dim"></p>
    <p class="dim">Indietro per annullare</p>
  </div>

  <div id="diag" class="screen" hidden>
    <h2>Prova comandi</h2>
    <p id="diagMode" class="dim"></p>
    <pre id="diagLog"></pre>
  </div>

  <div id="game" class="screen" tabindex="-1" hidden>
    <div id="ejs"></div>
    <div id="hud" aria-live="polite"></div>
  </div>

  <div id="menu" class="overlay" hidden>
    <div class="grid">
      <button data-act="resume" type="button">Riprendi</button>
      <button data-btn="start" type="button">START</button>
      <button data-btn="select" type="button">SELECT</button>
      <button data-btn="l" type="button">L</button>
      <button data-btn="r" type="button">R</button>
      <button data-act="run" type="button">Corri</button>
      <button data-act="walk" type="button">Camminata auto</button>
      <button data-act="speed" type="button">Veloce x2</button>
      <button data-act="audio" type="button">Audio</button>
      <button data-act="screen" type="button">Schermo</button>
      <button data-act="eco" type="button">Eco</button>
      <button data-act="save" type="button">Salva stato</button>
      <button data-act="load" type="button">Carica stato</button>
      <button data-act="backup" type="button">Backup</button>
      <button data-act="quit" type="button">Cambia gioco</button>
    </div>
  </div>

  <div id="backup" class="overlay" hidden>
    <div class="list" id="bakList"></div>
  </div>

  <div id="toast" role="status" hidden></div>
  <pre id="evlog" aria-hidden="true"></pre>

  <script>
  (function () {
    var log = [], el = document.getElementById('evlog');
    function add(m) { log.unshift(m); log.length = Math.min(log.length, 6); el.textContent = log.join('\n'); }
    window.__evlog = add;
    var t0 = performance.now();
    function ts() { return ((performance.now() - t0) / 1000).toFixed(1) + ' '; }
    ['keydown','keyup','pointerdown','pointerup','pointercancel','mousedown','mouseup','click','touchstart','touchend','wheel','contextmenu'].forEach(function (t) {
      window.addEventListener(t, function (e) {
        var d = t;
        if (e.key) d += ' ' + e.key;
        if (e.clientX !== undefined) d += ' @' + Math.round(e.clientX) + ',' + Math.round(e.clientY);
        if (e.pointerType) d += ' ' + e.pointerType;
        var tg = e.target && (e.target.id || e.target.tagName);
        add(ts() + d + ' -> ' + tg);
      }, true);
    });
    window.addEventListener('focusout', function (e) { add(ts() + 'focusout ' + (e.target.id || e.target.textContent || e.target.tagName).slice(0, 20)); }, true);
    window.addEventListener('blur', function () { add(ts() + 'window blur'); });
    window.addEventListener('popstate', function () { add(ts() + 'popstate'); });
    window.addEventListener('error', function (e) { add(ts() + 'ERRORE: ' + e.message); });
    window.addEventListener('unhandledrejection', function (e) { add(ts() + 'ERRORE: ' + (e.reason && e.reason.message || e.reason)); });
  })();
  </script>
  <script type="module" src="app.js?v=19"></script>
</body>
</html>
